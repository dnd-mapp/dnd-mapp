$schema: "./.moon/cache/schemas/project.json"

id: "root"
layer: "automation"
tags: ["tooling"]

project:
    title: "Repository"
    description: "The checks that cover the whole repository, such as formatting and Markdown linting, and the local TLS certificate of the dev servers."
    owner: "@dnd-mapp/reviewers"
    maintainers:
        - "@NoNamer777"

workspace:
    inheritedTasks:
        # The root project runs the checks that cover the whole repository, so it inherits none of the shared tasks in
        # .moon/tasks/.
        include: []

fileGroups:
    # Every file in the repository, since the root project checks them all.
    sources:
        - "**/*"
        # The glob also matches the package symlinks in each project's node_modules, which moon cannot hash.
        - "!**/node_modules/**"

    prettier-configs:
        - ".prettierrc.json"
        - ".prettierignore"

    markdownlint-configs:
        - ".markdownlint-cli2.yaml"
        - ".github/.markdownlint-cli2.yaml"

tasks:
    format:
        command: "prettier -w ."
        inputs:
            - "@group(sources)"
            - "@group(prettier-configs)"
        options:
            cache: false
            # The task rewrites files, so CI runs format-check instead.
            runInCI: false

    format-check:
        command: "prettier -c ."
        inputs:
            - "@group(sources)"
            - "@group(prettier-configs)"

    lint-md:
        command: "markdownlint-cli2"
        inputs:
            - "**/*.md"
            - "@group(markdownlint-configs)"

    ssl-certs:
        # mkcert creates no missing folders, so .ssl/.gitkeep keeps the folder in the repository. The script lists each host,
        # since a wildcard matches one label only, and adding a host changes the script, which invalidates the cache.
        script: mkcert -cert-file .ssl/cert.pem -key-file .ssl/key.pem localhost.www.dndmapp.dev localhost 127.0.0.1
        # The certificate depends on no files, only on the hosts in the script.
        inputs: []
        outputs:
            - ".ssl/cert.pem"
            - ".ssl/key.pem"
        options:
            # CI serves the apps behind Caddy instead of the dev servers.
            runInCI: false
