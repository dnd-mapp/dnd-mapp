$schema: "./.moon/cache/schemas/project.json"

id: "root"
layer: "automation"

tasks:
    format:
        command: "prettier -w ."
        inputs:
            - "**/*"
            # The glob also matches the package symlinks in each project's node_modules, which moon cannot hash.
            - "!**/node_modules/**"
            - ".prettierrc.json"
            - ".prettierignore"
        options:
            cache: false
            # The task rewrites files, so CI runs format-check instead.
            runInCI: false

    format-check:
        command: "prettier -c ."
        inputs:
            - "**/*"
            # The glob also matches the package symlinks in each project's node_modules, which moon cannot hash.
            - "!**/node_modules/**"
            - ".prettierrc.json"
            - ".prettierignore"

    lint-md:
        command: "markdownlint-cli2"
        inputs:
            - "**/*.md"
            - ".markdownlint-cli2.yaml"
            - ".github/.markdownlint-cli2.yaml"
