$schema: "../../.moon/cache/schemas/project.json"

id: "web-e2e"
layer: "automation"
tags:
    - "web"

project:
    title: "Web end-to-end tests"
    description: "The Playwright tests that run against the web client in Chromium."
    owner: "@dnd-mapp/reviewers"
    maintainers:
        - "@NoNamer777"

fileGroups:
    sources:
        - "src/**/*"
        - "playwright.config.ts"
        - "global-setup.ts"
        - "compose.yaml"
        - "Caddyfile"

tasks:
    e2e:
        command: "playwright test --ui"
        preset: "server"
        inputs:
            - "@group(sources)"
            - "@group(configs)"

    e2e-ci:
        # Runs the tests against the web image behind Caddy, in the stack of compose.yaml.
        command: "playwright test"
        env:
            CI: "true"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
        options:
            # The result depends on the web image, which moon cannot hash.
            cache: false

    typecheck:
        command: "tsc"
        # moon tracks the files of each project for its own tasks only, so the inputs also list the shared ESLint config
        # that eslint.config.ts imports.
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "eslint.config.ts"
            - project: "config-eslint"
              group: "sources"
