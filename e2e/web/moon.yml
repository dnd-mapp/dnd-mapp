$schema: "../../.moon/cache/schemas/project.json"

id: "web-e2e"
layer: "automation"

project:
    title: "Web end-to-end tests"
    description: "The Playwright tests that run against the web client in Chromium."
    owner: "@dnd-mapp/reviewers"
    maintainers:
        - "@NoNamer777"

fileGroups:
    sources:
        - "src/**/*"
        - "playwright.config.ts"

tasks:
    e2e:
        command: "playwright test --ui"
        preset: "server"
        inputs:
            - "@group(sources)"
            - "@group(configs)"

    e2e-ci:
        command: "playwright test"
        env:
            CI: "true"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
        outputs:
            - "playwright-report/**/*"
            - "test-results/**/*"
        options:
            # CI runs the end-to-end tests once it can start the app from a Docker image.
            runInCI: false

    typecheck:
        command: "tsc"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "eslint.config.ts"
