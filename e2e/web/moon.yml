$schema: "../../.moon/cache/schemas/project.json"

id: "web-e2e"
layer: "automation"
tags:
    - "web"

project:
    title: "Web end-to-end tests"
    description: "The Playwright tests that run against the web client in Chromium."
    owner: "@dnd-mapp/reviewers"
    maintainers:
        - "@NoNamer777"

fileGroups:
    sources:
        - "src/**/*"
        - "playwright.config.ts"
        - "global-setup.ts"
        - "compose.yaml"
        - "Caddyfile"

tasks:
    e2e:
        command: "playwright test --ui"
        preset: "server"
        inputs:
            - "@group(sources)"
            - "@group(configs)"

    web-image:
        # Builds the web image for the local runs of e2e-ci. CI skips this task, since the stack pulls the image that the
        # web-image job pushed for the commit, and so skips web:image, which the affected checks of CI still list.
        deps:
            - "web:image"
        options:
            runInCI: "skip"

    e2e-ci:
        # Runs the tests against the web image behind Caddy, in the stack of compose.yaml.
        command: "playwright test"
        deps:
            - "~:web-image"
        env:
            CI: "true"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
        options:
            # The result depends on the web image, which moon cannot hash.
            cache: false

    typecheck:
        command: "tsc"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "eslint.config.ts"
