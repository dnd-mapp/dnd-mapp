$schema: "./cache/schemas/workspace.json"

projects:
    globs:
        - "apps/*"
        - "packages/*/moon.yml"
        - "packages/*/*/moon.yml"
        - "e2e/*"
    sources:
        root: "."

telemetry: false

vcs:
    # moon falls back to this branch when it cannot read the base of a comparison from the CI environment.
    defaultBranch: "main"
