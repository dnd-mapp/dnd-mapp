$schema: "./cache/schemas/workspace.json"

projects:
    globs:
        - "apps/*"
        - "packages/*/moon.yml"
        - "packages/*/*/moon.yml"
        - "e2e/*"
    sources:
        root: "."

constraints:
    # Each project carries the tag of the platform it runs on, or tooling for the packages of the whole workspace. A
    # project may depend on projects with its own tag or with one of the tags listed for it, and never on a project
    # without a tag.
    tagRelationships:
        web:
            - "domain"
            - "tooling"
        server:
            - "domain"
            - "tooling"
        domain:
            - "tooling"
        tooling: []

telemetry: false

vcs:
    # moon falls back to this branch when it cannot read the base of a comparison from the CI environment.
    defaultBranch: "main"
