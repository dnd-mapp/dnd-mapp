$schema: "../cache/schemas/tasks.json"

# The file has no inheritedBy conditions, so every project inherits its file groups. The globs resolve from the root of
# each project.
fileGroups:
    configs:
        - "package.json"
        - "tsconfig*.json"
        # moon tracks the files of each project for its own tasks only, so the group lists the TypeScript presets and the
        # shared path aliases that the tsconfig files extend.
        - "/packages/config-typescript/*.json"
        - "/tsconfig.base.json"
