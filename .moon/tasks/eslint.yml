$schema: "../cache/schemas/tasks.json"

# Every project with an ESLint config inherits the lint task, so the root project, which has none, stays out of it.
inheritedBy:
    files:
        - "eslint.config.ts"

tasks:
    lint:
        command: "eslint . --max-warnings 0"
        # Each project that inherits the task defines the sources file group, and .moon/tasks/all.yml defines configs.
        # The glob covers the configs of the tools that ESLint lints, such as Vitest and Playwright, next to the ESLint
        # config itself. moon tracks the files of each project for its own tasks only, so the inputs also list the
        # shared ESLint config that each ESLint config imports.
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "*.config.ts"
            - project: "config-eslint"
              group: "sources"
