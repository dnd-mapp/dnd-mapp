$schema: "../cache/schemas/tasks.json"

# Every project with an ESLint config inherits the lint task, so the root project, which has none, stays out of it.
inheritedBy:
    files:
        - "eslint.config.ts"

tasks:
    lint:
        command: "eslint . --max-warnings 0"
        # Each project that inherits the task defines the sources file group. The glob covers the configs of the tools
        # that ESLint lints, such as Vitest and Playwright, next to the ESLint config itself.
        inputs:
            - "@group(sources)"
            - "*.config.ts"
