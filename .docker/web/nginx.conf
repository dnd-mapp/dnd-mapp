# The main configuration of the base image includes this file in its http block.

# nginx runs as an unprivileged user, so its temporary files go to /tmp instead of the root-owned /var/cache/nginx. With
# a read-only root file system, mount a tmpfs at /tmp.
client_body_temp_path /tmp/client_temp;
proxy_temp_path /tmp/proxy_temp;
fastcgi_temp_path /tmp/fastcgi_temp;
uwsgi_temp_path /tmp/uwsgi_temp;
scgi_temp_path /tmp/scgi_temp;

server_tokens off;

server {
    # An unprivileged user cannot bind to ports below 1024, so the image needs no added capabilities.
    listen 4200;
    listen [::]:4200;

    root /usr/share/nginx/html;

    # Redirect a directory without its trailing slash, such as the base path, relative to the host that the client asked
    # for, since a proxy in front of the container may serve it under another host and port.
    absolute_redirect off;

    # The Dockerfile writes the base path of the app in place of each @BASE_HREF@. The app renders on the client only, so
    # every path under the base path that matches no file falls back to index.html for the router.
    location @BASE_HREF@ {
        try_files $uri $uri/ @BASE_HREF@index.html;
    }

    # A path with a file extension names a file, so a missing one, such as a bundle of an older build, returns 404.
    location ~ \.[^/]+$ {
        try_files $uri =404;
    }

    # index.html names the hashed bundles of each build, so browsers revalidate it to load a new release.
    location = @BASE_HREF@index.html {
        add_header Cache-Control "no-cache";
    }

    # build-info.json reports the build that runs, so neither browsers nor proxies may store it.
    location = @BASE_HREF@build-info.json {
        add_header Cache-Control "no-store";
    }
}
