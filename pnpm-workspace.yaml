# yaml-language-server: $schema=https://www.schemastore.org/pnpm-workspace.json

# Dependency Resolution
minimumReleaseAge: 4320 # 3 days
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080 # 7 days

# Peer dependencies
strictPeerDependencies: true

# CLI Settings
engineStrict: true

# Build Settings
allowBuilds:
  lefthook: true
sideEffectsCache: false

# Other Settings
catalogMode: strict
savePrefix: "~"

# Workspaces
packages:
  - apps/*
  - packages/*

# Catalogs
catalogs:
  commitlint:
    "@commitlint/cli": ~21.2.4
    "@commitlint/config-conventional": ~21.2.4
  lefthook:
    lefthook: ~2.2.2
  markdownlint:
    markdownlint-cli2: ~0.24.0
  moon:
    "@moonrepo/cli": ~2.6.2
  prettier:
    prettier: ~3.9.10
