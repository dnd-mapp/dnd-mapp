ignoredOptionalDependencies:
  - "@oxc-parser/binding-wasm32-wasi"
minimumReleaseAge: 4320 # 3 days
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080 # 7 days

# Peer dependencies
strictPeerDependencies: true

# CLI Settings
engineStrict: true

# Build Settings
allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  lefthook: true
  lmdb: false
  msgpackr-extract: false
  unrs-resolver: false
sideEffectsCache: false

# Other Settings
catalogMode: strict
savePrefix: "~"

# Workspaces
packages:
  - apps/*
  - packages/*
  - packages/*/*
  - e2e/*

# Catalogs
catalogs:
  angular:
    "@angular-devkit/architect": ~0.2202.6
    "@angular-devkit/core": ~22.2.6
    "@angular/build": ~22.2.6
    "@angular/cdk": ~22.2.6
    "@angular/cli": ~22.2.6
    "@angular/common": ~22.2.5
    "@angular/compiler": ~22.2.5
    "@angular/compiler-cli": ~22.2.5
    "@angular/core": ~22.2.5
    "@angular/forms": ~22.2.5
    "@angular/platform-browser": ~22.2.5
    "@angular/router": ~22.2.5
    ng-packagr: ~22.2.6
    rxjs: ~7.8.2
    sass: ~1.108.1
    tslib: ~2.9.1
    typescript: ~6.0.3
  commitlint:
    "@commitlint/cli": ~21.2.4
    "@commitlint/config-conventional": ~21.2.4
  eslint:
    "@eslint/js": ~10.0.1
    angular-eslint: ~22.6.0
    eslint: ~10.14.0
    eslint-config-prettier: ~10.1.8
    eslint-import-resolver-typescript: ~4.4.5
    eslint-plugin-boundaries: ~7.4.2
    eslint-plugin-jsdoc: ~65.4.5
    eslint-plugin-playwright: ~2.12.2
    typescript-eslint: ~8.72.1
  lefthook:
    lefthook: ~2.2.2
  markdownlint:
    markdownlint-cli2: ~0.24.0
    markdownlint-rule-relative-links: ~5.1.4
  moon:
    "@moonrepo/cli": ~2.6.5
  node:
    "@types/node": ~26.6.6
  playwright:
    "@playwright/test": ~1.65.0
    playwright: ~1.65.0
  prettier:
    prettier: ~3.9.10
  storybook:
    "@analogjs/vite-plugin-angular": ~2.9.6
    "@storybook/angular-vite": ~10.6.6
    storybook: ~10.6.6
    vite: ~8.3.7
  style-dictionary:
