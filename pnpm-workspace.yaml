minimumReleaseAge: 4320 # 3 days
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080 # 7 days

# Peer dependencies
strictPeerDependencies: true

# CLI Settings
engineStrict: true

# Build Settings
allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  lefthook: true
  lmdb: false
  msgpackr-extract: false
  unrs-resolver: false
sideEffectsCache: false

# Other Settings
catalogMode: strict
savePrefix: "~"

# Workspaces
packages:
  - apps/*
  - packages/*
  - packages/*/*
  - e2e/*

# Catalogs
catalogs:
  angular:
    "@angular/build": ~22.2.5
    "@angular/cdk": ~22.2.5
    "@angular/cli": ~22.2.5
    "@angular/common": ~22.2.4
    "@angular/compiler": ~22.2.4
    "@angular/compiler-cli": ~22.2.4
    "@angular/core": ~22.2.4
    "@angular/platform-browser": ~22.2.4
    "@angular/router": ~22.2.4
    ng-packagr: ~22.2.5
    rxjs: ~7.8.2
    sass: ~1.107.0
    tslib: ~2.8.1
    typescript: ~6.0.3
  commitlint:
    "@commitlint/cli": ~21.2.4
    "@commitlint/config-conventional": ~21.2.4
  eslint:
    "@eslint/js": ~10.0.1
    angular-eslint: ~22.6.0
    eslint: ~10.13.0
    eslint-config-prettier: ~10.1.8
    eslint-import-resolver-typescript: ~4.4.5
    eslint-plugin-boundaries: ~7.4.0
    eslint-plugin-playwright: ~2.12.1
    typescript-eslint: ~8.72.1
  lefthook:
    lefthook: ~2.2.2
  markdownlint:
    markdownlint-cli2: ~0.24.0
  moon:
    "@moonrepo/cli": ~2.6.4
  node:
    "@types/node": ~26.6.6
  playwright:
    "@playwright/test": ~1.64.1
    playwright: ~1.64.1
  prettier:
    prettier: ~3.9.10
  vitest:
    "@vitest/browser-playwright": ~5.0.5
    "@vitest/coverage-v8": ~5.0.5
    "@vitest/ui": ~5.0.5
    vitest: ~5.0.5
