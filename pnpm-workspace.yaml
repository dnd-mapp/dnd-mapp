ignoredOptionalDependencies:
  - "@oxc-parser/binding-wasm32-wasi"
minimumReleaseAge: 4320 # 3 days
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080 # 7 days

# Peer dependencies
strictPeerDependencies: true

# CLI Settings
engineStrict: true

# Build Settings
allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  lefthook: true
  lmdb: false
  msgpackr-extract: false
  unrs-resolver: false
sideEffectsCache: false

# Other Settings
catalogMode: strict
savePrefix: "~"

# Workspaces
packages:
  - apps/*
  - packages/*
  - packages/*/*
  - e2e/*

# Catalogs
catalogs:
  angular:
    "@angular-devkit/architect": ~0.2202.7
    "@angular-devkit/core": ~22.2.7
    "@angular/animations": ~22.2.6
    "@angular/build": ~22.2.7
    "@angular/cdk": ~22.2.7
    "@angular/cli": ~22.2.7
    "@angular/common": ~22.2.6
    "@angular/compiler": ~22.2.6
    "@angular/compiler-cli": ~22.2.6
    "@angular/core": ~22.2.6
    "@angular/forms": ~22.2.6
    "@angular/platform-browser": ~22.2.6
    "@angular/router": ~22.2.6
    ng-packagr: ~22.3.0
    rxjs: ~7.8.2
    sass: ~1.108.2
    tslib: ~2.9.1
    typescript: ~6.0.3
  capsize:
    "@capsizecss/metrics": ~4.5.0
    "@capsizecss/unpack": ~4.0.1
  commitlint:
    "@commitlint/cli": ~21.2.4
    "@commitlint/config-conventional": ~21.2.4
  eslint:
    "@eslint/js": ~10.0.1
    angular-eslint: ~22.7.0
    eslint: ~10.15.0
    eslint-config-prettier: ~10.1.8
    eslint-import-resolver-typescript: ~4.4.5
    eslint-plugin-boundaries: ~7.4.4
    eslint-plugin-jsdoc: ~65.4.12
    eslint-plugin-playwright: ~2.12.2
    typescript-eslint: ~8.73.0
