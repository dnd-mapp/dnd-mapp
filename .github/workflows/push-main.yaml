# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: Push main

on:
    push:
        branches:
            - main

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    changes:
        name: Changes
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            tasks: ${{ steps.affected.outputs.tasks }}
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up pnpm and install dependencies
              uses: ./.github/actions/setup

            - name: List the affected tasks
              id: affected
              uses: ./.github/actions/affected-tasks
              with:
                  base: ${{ github.event.before }}
                  head: ${{ github.sha }}

    ci:
        name: CI
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up pnpm and install dependencies
              uses: ./.github/actions/setup

            - name: Run the checks
              uses: ./.github/actions/ci

    web-image:
        name: Web image
        # Run alongside the checks rather than after them, so the image is ready as soon as possible. A commit that
        # fails the checks still pushes its image.
        needs:
            - changes
        if: contains(fromJSON(needs.changes.outputs.tasks), 'web:image')
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Build and push the web image
              uses: ./.github/actions/docker-image
              with:
                  image: dndmapp/web
                  target: web-gha
                  dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN_WRITE }}
