# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: Push main

on:
    push:
        branches:
            - main

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    changes:
        name: Changes
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            tasks: ${{ steps.affected.outputs.tasks }}
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up pnpm and install dependencies
              uses: ./.github/actions/setup

            - name: List the affected tasks
              id: affected
              uses: ./.github/actions/affected-tasks
              with:
                  base: ${{ github.event.before }}
                  head: ${{ github.sha }}

    ci:
        name: CI
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up pnpm and install dependencies
              uses: ./.github/actions/setup

            - name: Run the checks
              uses: ./.github/actions/ci

    web-image:
        name: Web image
        # Run alongside the checks rather than after them, so the image is ready as soon as possible. A commit that
        # fails the checks still pushes its image.
        needs:
            - changes
        if: contains(fromJSON(needs.changes.outputs.tasks), 'web:image')
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
        outputs:
            image: dndmapp/web@${{ steps.image.outputs.digest }}
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Build and push the web image
              id: image
              uses: ./.github/actions/docker-image
              with:
                  image: dndmapp/web
                  target: web-gha
                  dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN_WRITE }}

    e2e:
        name: End-to-end tests
        # Test the image that the web-image job pushed for this commit. A commit that skips that job leaves the web app
        # as the latest web image of main has it, so the tests run against edge, for a change to the tests themselves.
        needs:
            - changes
            - web-image
        if: >-
            !cancelled()
            && needs.changes.result == 'success'
            && (needs.web-image.result == 'success' || needs.web-image.result == 'skipped')
            && (contains(fromJSON(needs.changes.outputs.tasks), 'web:image')
            || contains(fromJSON(needs.changes.outputs.tasks), 'web-e2e:e2e-ci'))
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            # In CI, moon diffs against the base branch before it runs a task, which needs the history of both.
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up pnpm and install dependencies
              uses: ./.github/actions/setup

            - name: Install Chromium for the end-to-end tests
              run: pnpm exec playwright install --no-shell chromium
              shell: bash

            # The stack pulls WEB_IMAGE. moon prefixes each output line with the task target, which hides the test
            # annotations from the runner, so sed strips the prefix from those lines.
            - name: Run the end-to-end tests
              run: pnpm moon run web-e2e:e2e-ci --summary minimal | sed -E 's/^[[:space:]]*[^[:space:]]+ \| (::)/\1/'
              shell: bash
              env:
                  WEB_IMAGE: ${{ needs.web-image.outputs.image || 'dndmapp/web:edge' }}

            - name: Upload the Playwright report
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: e2e/web/playwright-report/
                  retention-days: 7

    deploy-development:
        name: Deploy development
        # Development runs the edge tag, which the web-image job moves. A commit that skips that job leaves development
        # as it is.
        needs:
            - web-image
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
        environment:
            name: development
            url: https://dev.dndmapp.nl.eu.org/
        # A new deploy never cancels one that runs, so no update stops halfway. A newer deploy may replace one that waits,
        # which is safe since edge moves to the newest image anyway: an older deploy would pull that image too.
        concurrency:
            group: deploy-development
            cancel-in-progress: false
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Join the tailnet
              uses: ./.github/actions/join-tailnet
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}

            # WATCHTOWER_URL is a secret rather than a variable, so the logs mask the tailnet hostname.
            - name: Update the development container
              uses: ./.github/actions/watchtower-update
              with:
                  url: ${{ secrets.WATCHTOWER_URL }}
                  token: ${{ secrets.WATCHTOWER_API_TOKEN }}
                  container: dndmapp-dev

            # Watchtower answers once it has restarted the container, so the wait covers only the start of the new one.
            # tag:ci reaches only the Watchtower API, so the job reads build-info.json through the public URL.
            - name: Wait for development to run the commit
              uses: ./.github/actions/wait-for-commit
              with:
                  url: https://dev.dndmapp.nl.eu.org/build-info.json
                  commit: ${{ github.sha }}
                  timeout: "60"

    docker-hub-description:
        name: Docker Hub description
        # Docker Hub keeps one overview per repository rather than per tag, so only main publishes it, which keeps an
        # unmerged overview off Docker Hub. The job reads its files from the commit, so it waits on none of the others.
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # On a push to the default branch, the filter compares the commit with the one before the push, which it
            # fetches itself.
            - name: Check whether the push changes the description
              id: changes
              uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              with:
                  filters: |
                      description:
                          - .docker/web/README.md
                          - .docker/web/short-description.txt

            # The action reads the overview from a file but takes the short description as a string. The command
            # substitution drops the final line break, and the lint-short-description task keeps the file to one line.
            - name: Read the short description
              id: short-description
              if: steps.changes.outputs.description == 'true'
              run: echo "text=$(cat .docker/web/short-description.txt)" >> "$GITHUB_OUTPUT"
              shell: bash

            # The action sets both fields at once, so a change to either file publishes both.
            - name: Publish the overview and short description
              if: steps.changes.outputs.description == 'true'
              uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN_DELETE }}
                  repository: dndmapp/web
                  short-description: ${{ steps.short-description.outputs.text }}
                  readme-filepath: .docker/web/README.md
