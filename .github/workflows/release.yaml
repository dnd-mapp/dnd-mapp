# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: Release

# A maintainer approves a merged release commit by pushing a signed <project>@v<version> tag on it, such as web@v1.2.0.
# Nobody can update or delete a tag, so a run that fails is finished by re-running its failed jobs.
on:
    push:
        tags:
            - "*@v*"

permissions: {}

jobs:
    tag:
        name: Verify the tag
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            project: ${{ steps.tag.outputs.project }}
            version: ${{ steps.tag.outputs.version }}
            image: ${{ steps.tag.outputs.image }}
            target: ${{ steps.tag.outputs.target }}
        steps:
            # The full history holds main for the ancestry check. It also fetches the tags as they are, while a shallow
            # checkout would fetch only the tagged commit and lose the tag object with its signature.
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            # GitHub doesn't verify tag signatures for workflows, so git verifies the tag against the allowed signers on
            # main. Removing a key from that list then also stops it from releasing an older commit.
            - name: Verify the tag
              id: tag
              run: |
                  project="${TAG%@v*}"
                  version="${TAG##*@v}"

                  if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                      echo "::error::$TAG doesn't end in a version such as @v1.2.0."
                      exit 1
                  fi

                  case "$project" in
                      web)
                          image=dndmapp/web
                          target=web-gha
                          ;;
                      *)
                          echo "::error::$TAG names $project, which has no release image."
                          exit 1
                          ;;
                  esac

                  if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
                      echo "::error::$TAG is a lightweight tag. Release from an annotated tag signed with git tag --sign."
                      exit 1
                  fi

                  git show origin/main:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"

                  if ! git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" tag --verify "$TAG"; then
                      echo "::error::$TAG has no signature of a key in .github/allowed_signers on main."
                      exit 1
                  fi

                  if ! git merge-base --is-ancestor "refs/tags/$TAG^{commit}" origin/main; then
                      echo "::error::$TAG points at a commit that main doesn't reach."
                      exit 1
                  fi

                  {
                      echo "project=$project"
                      echo "version=$version"
                      echo "image=$image"
                      echo "target=$target"
                  } >> "$GITHUB_OUTPUT"
              shell: bash
              env:
                  TAG: ${{ github.ref_name }}

    release-notes:
        name: Verify the release
        needs:
            - tag
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Check out the tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up pnpm and install dependencies
              uses: ./.github/actions/setup

            - name: Find the folder of the project
              id: project
              run: echo "folder=$(pnpm exec moon project "$PROJECT" --json | jq -r .source)" >> "$GITHUB_OUTPUT"
              shell: bash
              env:
                  PROJECT: ${{ needs.tag.outputs.project }}

            - name: Verify the version of the manifest and the changelog
              run: pnpm exec release verify "$VERSION"
              shell: bash
              working-directory: ${{ steps.project.outputs.folder }}
              env:
                  VERSION: ${{ needs.tag.outputs.version }}

            - name: Extract the release notes
              run: pnpm exec release notes "$VERSION" "$RUNNER_TEMP/release-notes.md"
              shell: bash
              working-directory: ${{ steps.project.outputs.folder }}
              env:
                  VERSION: ${{ needs.tag.outputs.version }}

            - name: Upload the release notes
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: release-notes
                  path: ${{ runner.temp }}/release-notes.md
                  if-no-files-found: error

    image:
        name: Release image
        needs:
            - tag
            - release-notes
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
        # The deploy jobs compare latest with this digest, to catch a newer release that has moved latest meanwhile.
        outputs:
            digest: ${{ steps.image.outputs.digest }}
        steps:
            - name: Check out the tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The image is built again at the tag rather than tagged from sha-<short>, since Push main skips the image
            # of a commit that doesn't affect it, so that tag may not exist.
            - name: Build and push the release image
              id: image
              uses: ./.github/actions/docker-image
              with:
                  image: ${{ needs.tag.outputs.image }}
                  target: ${{ needs.tag.outputs.target }}
                  version: ${{ needs.tag.outputs.version }}
                  dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN_WRITE }}

    github-release:
        name: GitHub Release
        needs:
            - tag
            - release-notes
            - image
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: write
            discussions: write
        steps:
            - name: Download the release notes
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: release-notes
                  path: ${{ runner.temp }}

            # A re-run leaves a Release that an earlier attempt created as it is. The repository releases several
            # projects, so no Release is marked as the latest of them all.
            - name: Create the GitHub Release
              run: |
                  if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
                      echo "::notice::The Release of $TAG already exists."
                      exit 0
                  fi

                  gh release create "$TAG" \
                      --verify-tag \
                      --title "Release $PROJECT v$VERSION" \
                      --notes-file "$RUNNER_TEMP/release-notes.md" \
                      --latest=false \
                      --discussion-category Announcements
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ github.ref_name }}
                  PROJECT: ${{ needs.tag.outputs.project }}
                  VERSION: ${{ needs.tag.outputs.version }}

    staging:
        name: Deploy staging
        # Staging runs the image that the release is about to put in production, with production's setup. The tests run
        # in the same job, so its concurrency group keeps another release off staging until they finish.
        needs:
            - tag
            - image
            - github-release
        if: needs.tag.outputs.project == 'web'
        runs-on: ubuntu-26.04
        timeout-minutes: 20
        permissions:
            contents: read
        environment:
            name: staging
            url: https://staging.dndmapp.nl.eu.org/
        # A new deploy never cancels one that runs, so no update or test run stops halfway.
        concurrency:
            group: deploy-staging
            cancel-in-progress: false
        steps:
            # In CI, moon diffs against the base branch before it runs a task, which needs the history of both.
            - name: Check out the tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Join the tailnet
              uses: ./.github/actions/join-tailnet
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}

            # Watchtower pulls whatever latest points at, which a newer release may have pushed since. That image hasn't
            # passed the tests on staging yet, so this release stops and leaves both deploys to the run of the newer
            # one. A rollback moves latest too, and the release stops then as well, since it was rolled back. A re-run
            # keeps the digest of the first attempt, so it stops too.
            - name: Check that latest is the image of this release
              uses: ./.github/actions/image-tag
              with:
                  image: ${{ needs.tag.outputs.image }}
                  tag: latest
                  digest: ${{ needs.image.outputs.digest }}

            # Staging and production both follow latest, so the call names the container. WATCHTOWER_URL is a secret
            # rather than a variable, so the logs mask the tailnet hostname.
            - name: Update the staging container
              uses: ./.github/actions/watchtower-update
              with:
                  url: ${{ secrets.WATCHTOWER_URL }}
                  token: ${{ secrets.WATCHTOWER_API_TOKEN }}
                  container: dndmapp-staging

            # Watchtower answers once it has restarted the container, so the wait covers only the start of the new one.
            - name: Wait for staging to run the commit
              uses: ./.github/actions/wait-for-commit
              with:
                  url: https://staging.dndmapp.nl.eu.org/build-info.json
                  commit: ${{ github.sha }}
                  timeout: "60"

            - name: Set up pnpm and install dependencies
              uses: ./.github/actions/setup

            - name: Install Chromium for the end-to-end tests
              run: pnpm exec playwright install --no-shell chromium
              shell: bash

            # BASE_URL points the tests at staging, so they start no stack of their own. moon prefixes each output line
            # with the task target, which hides the test annotations from the runner, so sed strips the prefix from
            # those lines.
            # sed -u passes on each line as it reads it, so the log shows the output while the tests run.
            - name: Run the end-to-end tests against staging
              run: pnpm moon run web-e2e:e2e-ci --summary minimal | sed -uE 's/^[[:space:]]*[^[:space:]]+ \| (::)/\1/'
              shell: bash
              env:
                  BASE_URL: https://staging.dndmapp.nl.eu.org/

            # A re-run of the failed jobs uploads to the same run, which holds one artifact per name, so the name
            # carries the attempt.
            - name: Upload the Playwright report
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report-${{ github.run_attempt }}
                  path: e2e/web/playwright-report/
                  retention-days: 7

    production:
        name: Deploy production
        # Production pulls latest only when this job asks it to, so a release that fails on staging leaves production
        # on the previous release.
        needs:
            - tag
            - image
            - staging
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
        environment:
            name: production
            url: https://www.dndmapp.nl.eu.org/
        concurrency:
            group: deploy-production
            cancel-in-progress: false
        steps:
            - name: Check out the tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Join the tailnet
              uses: ./.github/actions/join-tailnet
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}

            # A newer release or a rollback may move latest while the tests run on staging, so the check runs again right
            # before this update.
            - name: Check that latest is the image of this release
              uses: ./.github/actions/image-tag
              with:
                  image: ${{ needs.tag.outputs.image }}
                  tag: latest
                  digest: ${{ needs.image.outputs.digest }}

            - name: Update the production container
              uses: ./.github/actions/watchtower-update
              with:
                  url: ${{ secrets.WATCHTOWER_URL }}
                  token: ${{ secrets.WATCHTOWER_API_TOKEN }}
                  container: dndmapp-prod

            - name: Wait for production to run the commit
              uses: ./.github/actions/wait-for-commit
              with:
                  url: https://www.dndmapp.nl.eu.org/build-info.json
                  commit: ${{ github.sha }}
                  timeout: "60"
