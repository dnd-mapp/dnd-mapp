# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: Pull request closed

on:
    pull_request:
        types:
            - closed

permissions: {}

jobs:
    delete-storybook-preview:
        name: Delete the Storybook preview
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            # The job pushes the site without the preview to gh-pages.
            contents: write
            deployments: write
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # A pull request whose changes never affected ui-web:build-storybook has no folder, and the action then
            # pushes nothing.
            - name: Remove the folder of the pull request from the site
              uses: ./.github/actions/publish-pages
              with:
                  folder: pr/${{ github.event.pull_request.number }}
                  message: Remove the Storybook preview of pull request ${{ github.event.pull_request.number }}
                  token: ${{ github.token }}

            # The payload of each preview deployment names its pull request, as the Pull request workflow creates it.
            - name: Mark the deployments of the pull request as inactive
              run: |
                  gh api --paginate "repos/$GITHUB_REPOSITORY/deployments?environment=storybook-preview&per_page=100" \
                      --jq ".[] | select(.payload.pull_request == $NUMBER) | .id" \
                      | while read -r id; do
                          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --silent -f state=inactive
                          echo "Marked deployment $id as inactive."
                      done
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  NUMBER: ${{ github.event.pull_request.number }}

    delete-web-image:
        name: Delete the web image
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        steps:
            # Docker Hub deletes tags through its API only, which needs an access token with delete access. The
            # endpoint is missing from the current API reference, but Docker Hub still serves it.
            - name: Delete the pr tag of the web image from Docker Hub
              run: |
                  credentials="$(jq -n --arg identifier "$DOCKERHUB_USERNAME" --arg secret "$DOCKERHUB_TOKEN" \
                      '{identifier: $identifier, secret: $secret}')"
                  token="$(curl -fsS -X POST https://hub.docker.com/v2/auth/token \
                      -H 'Content-Type: application/json' -d "$credentials" | jq -r .access_token)"
                  echo "::add-mask::$token"

                  status="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $token" \
                      "https://hub.docker.com/v2/repositories/$IMAGE/tags/$TAG/")"

                  case "$status" in
                      204) echo "Deleted $IMAGE:$TAG." ;;
                      # moon found no change in the pull request that affects the web image, so CI never pushed it.
                      404) echo "::notice::$IMAGE:$TAG does not exist, so there is nothing to delete." ;;
                      *) echo "::error::Docker Hub answered $status to deleting $IMAGE:$TAG."; exit 1 ;;
                  esac
              shell: bash
              env:
                  IMAGE: dndmapp/web
                  TAG: pr-${{ github.event.pull_request.number }}
                  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_DELETE }}
