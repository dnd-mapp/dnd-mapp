# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: Pull request

on:
    pull_request:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    changes:
        name: Changes
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            tasks: ${{ steps.affected.outputs.tasks }}
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up pnpm and install dependencies
              uses: ./.github/actions/setup

            - name: List the affected tasks
              id: affected
              uses: ./.github/actions/affected-tasks
              with:
                  base: ${{ github.event.pull_request.base.sha }}
                  head: ${{ github.event.pull_request.head.sha }}

    ci:
        name: CI
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
            # The run report of the checks comments on the pull request.
            pull-requests: write
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up pnpm and install dependencies
              uses: ./.github/actions/setup

            - name: Lint the commit messages
              run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

            - name: Run the checks
              uses: ./.github/actions/ci

    web-image:
        name: Web image
        # Run alongside the checks rather than after them, so the image is ready as soon as possible. A commit that
        # fails the checks still pushes its image.
        needs:
            - changes
        if: contains(fromJSON(needs.changes.outputs.tasks), 'web:image')
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
        outputs:
            image: dndmapp/web@${{ steps.image.outputs.digest }}
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Build and push the web image
              id: image
              uses: ./.github/actions/docker-image
              with:
                  image: dndmapp/web
                  target: web-gha
                  dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN_WRITE }}

    e2e:
        name: End-to-end tests
        # Test the image that the web-image job pushed for this commit. A commit that skips that job leaves the web app
        # as the latest web image of main has it, so the tests run against edge, for a change to the tests themselves.
        needs:
            - changes
            - web-image
        if: >-
            !cancelled()
            && needs.changes.result == 'success'
            && (needs.web-image.result == 'success' || needs.web-image.result == 'skipped')
            && (contains(fromJSON(needs.changes.outputs.tasks), 'web:image')
            || contains(fromJSON(needs.changes.outputs.tasks), 'web-e2e:e2e-ci'))
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            # In CI, moon diffs against the base branch before it runs a task, which needs the history of both.
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up pnpm and install dependencies
              uses: ./.github/actions/setup

            # The browser runs in the Playwright image of the stack, so the runner installs none. moon skips web:image in
            # CI, and the stack pulls WEB_IMAGE instead. moon prefixes each output line with the task target, which hides
            # the test annotations from the runner, so sed strips the prefix from those lines.
            - name: Run the end-to-end tests
              run: pnpm moon run web-e2e:e2e-ci --summary minimal | sed -E 's/^[[:space:]]*[^[:space:]]+ \| (::)/\1/'
              shell: bash
              env:
                  WEB_IMAGE: ${{ needs.web-image.outputs.image || 'dndmapp/web:edge' }}

            - name: Upload the Playwright report
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: e2e/web/playwright-report/
                  retention-days: 7

    pull-request-title:
        # Keep this job in sync with pull-request-edited.yaml, which reruns it when the title is edited.
        name: Pull request title
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up pnpm and install dependencies
              uses: ./.github/actions/setup

            - name: Lint the pull request title
              run: printf '%s\n' "$TITLE" | pnpm exec commitlint --verbose
              shell: bash
              env:
                  TITLE: ${{ github.event.pull_request.title }}
