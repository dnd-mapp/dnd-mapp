# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: Pull request

on:
    pull_request:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    changes:
        name: Changes
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            tasks: ${{ steps.affected.outputs.tasks }}
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up pnpm and install dependencies
              uses: ./.github/actions/setup

            - name: List the affected tasks
              id: affected
              uses: ./.github/actions/affected-tasks
              with:
                  base: ${{ github.event.pull_request.base.sha }}
                  head: ${{ github.event.pull_request.head.sha }}

    ci:
        name: CI
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up pnpm and install dependencies
              uses: ./.github/actions/setup

            - name: Lint the commit messages
              run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

            - name: Run the checks
              uses: ./.github/actions/ci

    web-build:
        name: Web build
        needs:
            - changes
        if: contains(fromJSON(needs.changes.outputs.tasks), 'web:image')
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            # moon run compares against the base branch in CI, which a shallow clone lacks.
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up pnpm and install dependencies
              uses: ./.github/actions/setup

            - name: Build the web app
              run: pnpm moon run web:build
              shell: bash

            # The web-image job builds the image from this output, so it needs no Node.js setup of its own.
            - name: Upload the web app
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: web-dist
                  path: apps/web/dist/web/browser/
                  if-no-files-found: error
                  retention-days: 1

    web-image:
        name: Web image
        # Run alongside the checks rather than after them, so the image is ready as soon as possible. A commit that
        # fails the checks still pushes its image.
        needs:
            - web-build
        runs-on: ubuntu-26.04
        # Building for two platforms, one of them emulated, takes a few minutes.
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Download the web app
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: web-dist
                  path: apps/web/dist/web/browser/

            - name: Build and push the web image
              uses: ./.github/actions/docker-image
              with:
                  image: dndmapp/web
                  target: web-gha
                  dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
                  dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN_WRITE }}

    pull-request-title:
        # Keep this job in sync with pull-request-edited.yaml, which reruns it when the title is edited.
        name: Pull request title
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up pnpm and install dependencies
              uses: ./.github/actions/setup

            - name: Lint the pull request title
              run: printf '%s\n' "$TITLE" | pnpm exec commitlint --verbose
              shell: bash
              env:
                  TITLE: ${{ github.event.pull_request.title }}
