# yaml-language-server: $schema=https://www.schemastore.org/github-issue-forms.json

name: Epic
description: A bounded outcome split into sub-issues. Filed by maintainers.
type: Epic
projects:
    - dnd-mapp/10
body:
    - type: markdown
      attributes:
          value: |
              An Epic is one bounded outcome, sized to close within six weeks of starting, and split into Feature, Task, Bug, and Research sub-issues. Maintainers file Epics; if you aren't one, open a Feature or start a [Discussion](https://github.com/dnd-mapp/dnd-mapp/discussions) instead. Triage sets Class of service and Target date from your Urgency answer.

    - type: textarea
      id: why
      attributes:
          label: Why
          description: The problem this Epic solves and why it matters. Every sub-issue points back to it. Link related Discussions, Research issues, and ADRs here.
      validations:
          required: true

    - type: textarea
      id: done-when
      attributes:
          label: Done when
          description: Checkable outcomes that are true once the Epic is finished. The owner checks each one before closing the Epic. Add a measurable signal when one exists.
          value: "- [ ] "
      validations:
          required: true

    - type: textarea
      id: scope
      attributes:
          label: Scope
          description: What the Epic covers, and what it leaves out so it can't grow into a theme.
          value: |
              **In scope**

              -

              **Out of scope**

              -
      validations:
          required: true

    - type: textarea
      id: urgency
      attributes:
          label: Urgency
          description: Why now, what waiting costs, and any outside date the work must meet.
      validations:
          required: true

    - type: textarea
      id: open-questions
      attributes:
          label: Open questions
          description: Unknowns and risks. File each one that blocks the work as a Research issue, and link it as blocking this Epic.
