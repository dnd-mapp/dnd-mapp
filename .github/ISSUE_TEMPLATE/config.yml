# yaml-language-server: $schema=https://www.schemastore.org/github-issue-config.json

blank_issues_enabled: false
contact_links:
    - name: Propose a feature
      url: https://github.com/dnd-mapp/dnd-mapp/discussions/categories/ideas
      about: Share or upvote an idea in Discussions. Solid ideas become issues.

    - name: Ask a question
      url: https://github.com/dnd-mapp/dnd-mapp/discussions/categories/q-a
