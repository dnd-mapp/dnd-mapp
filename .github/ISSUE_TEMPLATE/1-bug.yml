# yaml-language-server: $schema=https://www.schemastore.org/github-issue-forms.json

name: Bug
description: Report behavior that is broken or differs from what is documented or intended.
type: Bug
body:
    - type: markdown
      attributes:
          value: >
              Report something in D&D Mapp that is broken, or that differs from what is documented or intended. This
              includes D&D Mapp handling a rule of the game differently from the rulebook.


              Never report a security vulnerability in a public issue. Report it privately, as the
              [security policy](https://github.com/dnd-mapp/dnd-mapp/blob/main/SECURITY.md#reporting-a-vulnerability)
              describes.

    - type: textarea
      id: description
      validations:
          required: true
      attributes:
          label: Description
          description: What is broken?

    - type: input
      id: version
      validations:
          required: true
      attributes:
          label: Version
          description: >
              The `version` that `build-info.json` reports on the site where the bug happens, as
              <https://www.dndmapp.nl.eu.org/build-info.json> does for production.
          placeholder: 0.1.0, edge, or pr-42

    - type: dropdown
      id: environment
      validations:
          required: true
      attributes:
          label: Environment
          description: Where the bug happens.
          options:
              - Production (www.dndmapp.nl.eu.org)
              - Staging (staging.dndmapp.nl.eu.org)
              - Development (dev.dndmapp.nl.eu.org)
              - My own deployment of the dndmapp/web image
              - A local build from source

    - type: dropdown
      id: area
      validations:
          required: true
      attributes:
          label: Area
          description: The part of D&D Mapp the bug is in.
          options:
              - Web app
              - Docker image
              - Not sure

    - type: textarea
      id: steps
      validations:
          required: true
      attributes:
          label: Steps to reproduce
          description: The steps that make the bug happen, starting from a fresh page load.
          value: "1. "

    - type: textarea
      id: expected
      validations:
          required: true
      attributes:
          label: Expected behavior
          description: What you expected to happen. For a rule of the game, cite the rulebook page or SRD section.

    - type: textarea
      id: actual
      validations:
          required: true
      attributes:
          label: Actual behavior
          description: What happened instead.

    - type: textarea
      id: browser
      attributes:
          label: Browser and device
          description: The browser, operating system, and device you used.

    - type: textarea
      id: logs
      attributes:
          label: Logs
          description: Error messages or console output. This field is formatted as code, so no backticks are needed.
          render: shell

    - type: textarea
      id: context
      attributes:
          label: Additional context
          description: Screenshots, recordings, links, or anything else that helps explain the bug.

    - type: checkboxes
      id: preflight
      attributes:
          label: Before you post
          options:
              - label: I searched the existing issues for this bug.
                required: true
              - label: I checked everything in this post myself, including any part an AI tool wrote, as [Using AI tools](https://github.com/dnd-mapp/dnd-mapp/blob/main/CONTRIBUTING.md#using-ai-tools) describes.
                required: true
              - label: I agree to follow this project's [code of conduct](https://github.com/dnd-mapp/dnd-mapp/blob/main/CODE_OF_CONDUCT.md).
                required: true
