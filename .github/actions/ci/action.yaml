# yaml-language-server: $schema=https://www.schemastore.org/github-action.json

name: CI
description: Run the moon tasks affected by the changes, and lint the workflows.

runs:
    using: composite
    steps:
        - name: Annotate Markdown findings on the pull request
          run: echo "::add-matcher::.github/markdownlint-matcher.json"
          shell: bash

        - name: Install Chromium for the unit tests
          run: pnpm exec playwright install --with-deps chromium
          shell: bash
          working-directory: apps/web

        # moon prefixes each output line with the task target, which hides workflow commands such as the test annotations
        # from the runner, so sed strips the prefix from those lines. The minimal summary skips the replay of failed task
        # output, which would annotate each finding a second time.
        - name: Run the affected moon tasks
          run: pnpm moon ci --summary minimal | sed -E 's/^[[:space:]]*[^[:space:]]+ \| (::)/\1/'
          shell: bash

        - name: Annotate workflow findings on the pull request
          run: echo "::add-matcher::.github/actionlint-matcher.json"
          shell: bash

        - name: Lint the workflows
          uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          with:
              args: -color
