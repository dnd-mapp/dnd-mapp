# yaml-language-server: $schema=https://www.schemastore.org/github-action.json

name: CI
description: Run the moon tasks affected by the changes, and lint the workflows.

runs:
    using: composite
    steps:
        - name: Annotate Markdown findings on the pull request
          run: echo "::add-matcher::.github/markdownlint-matcher.json"
          shell: bash

        - name: Annotate ESLint findings on the pull request
          run: echo "::add-matcher::.github/eslint-matcher.json"
          shell: bash

        # Playwright installs the browser into a cache that every project on the playwright catalog shares, so the root
        # installs it once for the unit tests of all of them.
        - name: Install Chromium for the unit tests
          run: pnpm exec playwright install --no-shell chromium
          shell: bash

        # moon prefixes each output line with the task target, which hides workflow commands such as the test annotations
        # from the runner, so sed strips the prefix from those lines. The minimal summary skips the replay of failed task
        # output, which would annotate each finding a second time. The targets name the checks, so web:build and
        # web:image stay out of this job. The web-image job builds the app inside the image instead.
        - name: Run the affected moon tasks
          run: |
              pnpm moon ci :format-check :lint :lint-md :test-ci :typecheck --summary minimal \
                  | sed -E 's/^[[:space:]]*[^[:space:]]+ \| (::)/\1/'
          shell: bash

        # The report lists each task that moon ran or skipped, also when one of them failed. It comments on the pull
        # request and updates that comment on later pushes. A push to main would comment on the pull request it merged,
        # so it writes only the job summary.
        - name: Report the moon tasks that ran
          if: success() || failure()
          uses: moonrepo/run-report-action@bbe7e99bf2aca819ec660ec01fc59d84bdd492d6 # v1.10.0
          with:
              access-token: ${{ github.token }}
              skip-comment: ${{ github.event_name != 'pull_request' }}

        - name: Annotate workflow findings on the pull request
          run: echo "::add-matcher::.github/actionlint-matcher.json"
          shell: bash

        - name: Lint the workflows
          uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          with:
              args: -color
