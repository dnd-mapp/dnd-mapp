# yaml-language-server: $schema=https://www.schemastore.org/github-action.json

name: Join the tailnet
description: >-
    Join the tailnet as tag:ci for the rest of the job, and leave it when the job ends. The job needs the id-token: write
    permission, since the action signs in with its GitHub OIDC token.

inputs:
    oauth-client-id:
        description: >-
            The client ID of a Tailscale federated identity with the auth_keys scope that may tag nodes with tag:ci. Each
            environment has its own identity, which trusts only the OIDC subject of jobs in that environment.
        required: true
    audience:
        description: The audience of that federated identity.
        required: true

runs:
    using: composite
    steps:
        # The action trades the OIDC token of the job for a short-lived Tailscale token, so no secret is stored.
        # tag:ci reaches only the Watchtower API on port 443, so the job reaches every other host through its public URL.
        - name: Join the tailnet
          uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
          with:
              oauth-client-id: ${{ inputs.oauth-client-id }}
              audience: ${{ inputs.audience }}
              tags: tag:ci
