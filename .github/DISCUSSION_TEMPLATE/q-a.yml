# yaml-language-server: $schema=https://www.schemastore.org/github-discussion.json

body:
    - type: markdown
      attributes:
          value: >
              Ask anything about using, running, or contributing to D&D Mapp, including how its engine handles a rule of
              the game. Rulings at your own table that have no tie to D&D Mapp belong in a D&D community instead.


              When D&D Mapp handles a rule differently from the rulebook, or something else is broken, open an issue
              instead.


              Once a reply solves your question, mark it as the answer so others can find it.

    - type: textarea
      id: question
      validations:
          required: true
      attributes:
          label: Question
          description: What do you want to know?

    - type: dropdown
      id: version
      attributes:
          label: Version
          description: >
              The release your question is about, if any. The site you use reports it in `build-info.json`, as
              <https://www.dndmapp.nl.eu.org/build-info.json> does.
          options:
              - 0.1.0
              - Unreleased (the development site, an edge or pr-<number> image, or a build from source)

    - type: dropdown
      id: environment
      attributes:
          label: Environment
          description: Where you run D&D Mapp, if your question depends on it.
          options:
              - Production (www.dndmapp.nl.eu.org)
              - Staging (staging.dndmapp.nl.eu.org)
              - Development (dev.dndmapp.nl.eu.org)
              - My own deployment of the dndmapp/web image
              - A local build from source

    - type: dropdown
      id: area
      attributes:
          label: Area
          description: The part of D&D Mapp your question is about, if any.
          options:
              - Web app
              - Docker image
              - Not sure

    - type: textarea
      id: context
      attributes:
          label: Context
          description: What you are trying to do, what you have tried, and where you got stuck.

    - type: checkboxes
      id: preflight
      attributes:
          label: Before you post
          options:
              - label: I searched the existing discussions and issues for this question.
                required: true
              - label: I checked everything in this post myself, including any part an AI tool wrote, as [Using AI tools](https://github.com/dnd-mapp/dnd-mapp/blob/main/CONTRIBUTING.md#using-ai-tools) describes.
                required: true
              - label: I agree to follow this project's [code of conduct](https://github.com/dnd-mapp/dnd-mapp/blob/main/CODE_OF_CONDUCT.md).
                required: true
