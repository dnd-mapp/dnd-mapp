# yaml-language-server: $schema=https://www.schemastore.org/github-discussion.json

body:
    - type: markdown
      attributes:
          value: >
              Share a problem D&D Mapp could solve, even when you have no solution yet. A rough idea is welcome: the
              discussion below is where it takes shape. Upvote an existing idea rather than posting it again.


              This is also the place to argue for a different reading of a rule, or for a house-rule variant the engine
              should support. To report something broken, open an issue instead.


              Once an idea is ready, a maintainer opens an issue for it, links it here, and closes this discussion as
              resolved. The conversation then continues on the issue.

    - type: textarea
      id: problem
      validations:
          required: true
      attributes:
          label: Problem
          description: What do you want to do that D&D Mapp makes hard or impossible today?

    - type: textarea
      id: solution
      attributes:
          label: Proposed solution
          description: How you picture D&D Mapp solving it. Leave this empty when you are not sure yet.

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: Other solutions or workarounds you thought of, and why they fall short.

    - type: dropdown
      id: audience
      attributes:
          label: Who is this for?
          description: Pick everyone who would benefit.
          multiple: true
          options:
              - Dungeon Master
              - Player
              - Admin (manages users, servers, and data from the dashboards)
              - Contributor or developer

    - type: textarea
      id: context
      attributes:
          label: Additional context
          description: Screenshots, mockups, links, or examples from other tools.

    - type: checkboxes
      id: preflight
      attributes:
          label: Before you post
          options:
              - label: I searched the existing discussions and issues for this idea.
                required: true
              - label: I agree to follow this project's [code of conduct](https://github.com/dnd-mapp/dnd-mapp/blob/main/CODE_OF_CONDUCT.md).
                required: true
