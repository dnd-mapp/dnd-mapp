$schema: "../../.moon/cache/schemas/project.json"

id: "web"
layer: "application"
tags:
    - "web"

project:
    title: "Web client"
    description: "The Angular web client of D&D Mapp."
    owner: "@dnd-mapp/reviewers"
    maintainers:
        - "@NoNamer777"

fileGroups:
    sources:
        - "src/**/*"
        - "public/**/*"
        - "angular.json"

tasks:
    start:
        command: "ng serve"
        preset: "server"
        deps:
            - "root:ssl-certs"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - project: "core-web"
              group: "sources"

    build:
        command: "ng build"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - project: "core-web"
              group: "sources"
        outputs:
            - "dist/**/*"

    image:
        command: "docker buildx bake --file .docker/bake.hcl web"
        deps:
            - "~:build"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - project: "core-web"
              group: "sources"
            - "/.dockerignore"
            - "/.docker/bake.hcl"
            - "/.docker/web/**/*"
        options:
            # The image lands in the Docker daemon rather than in files that moon can restore from its cache.
            cache: false
            # The paths in the bake file resolve from the root of the repository.
            runFromWorkspaceRoot: true
