$schema: "../../.moon/cache/schemas/project.json"

id: "web"
layer: "application"

project:
    title: "Web client"
    description: "The Angular web client of D&D Mapp."
    owner: "@dnd-mapp/reviewers"
    maintainers:
        - "@NoNamer777"

fileGroups:
    sources:
        - "src/**/*"
        - "public/**/*"
        - "angular.json"

    tests:
        - "vitest.config.ts"

tasks:
    start:
        command: "ng serve"
        preset: "server"
        deps:
            - "root:ssl-certs"
        inputs:
            - "@group(sources)"
            - "@group(configs)"

    build:
        command: "ng build"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
        outputs:
            - "dist/**/*"

    image:
        command: "docker buildx bake --file .docker/bake.hcl web"
        deps:
            - "~:build"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "/.dockerignore"
            - "/.docker/bake.hcl"
            - "/.docker/web/**/*"
        options:
            # The image lands in the Docker daemon rather than in files that moon can restore from its cache.
            cache: false
            # The paths in the bake file resolve from the root of the repository.
            runFromWorkspaceRoot: true

    test:
        command: "ng test"
        preset: "server"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "@group(tests)"

    test-ci:
        command: "ng test -c ci"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "@group(tests)"
        outputs:
            - "coverage/**/*"
