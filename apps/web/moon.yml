$schema: "../../.moon/cache/schemas/project.json"

id: "web"
layer: "application"
tags:
    - "web"

project:
    title: "Web client"
    description: "The Angular web client of D&D Mapp."
    owner: "@dnd-mapp/reviewers"
    maintainers:
        - "@NoNamer777"

fileGroups:
    sources:
        - "src/**/*"
        - "public/**/*"
        - "angular.json"
        - "scripts/**/*"

tasks:
    start:
        command: "ng serve"
        preset: "server"
        deps:
            - "root:ssl-certs"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - project: "core-web"
              group: "sources"
            - project: "design-tokens"
              group: "css"

    build:
        command: "ng build"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - project: "core-web"
              group: "sources"
            - project: "design-tokens"
              group: "css"
        outputs:
            - "dist/**/*"

    build-info:
        # Stamps the commit and version into build-info.json in the output of build. The image runs the script itself.
        command: "node scripts/build-info.ts"
        deps:
            - "~:build"
        env:
            COMMIT_SHA: "$vcsRevision"
            VERSION: "local"
        options:
            # The commit changes without any input changing, so moon must not restore an earlier stamp.
            cache: false

    image:
        # The image builds the app from source, so the task needs no build of its own. Set BASE_HREF to serve the app
        # under another base path, such as /pr-42/.
        command: "docker buildx bake --file .docker/bake.hcl web"
        env:
            COMMIT_SHA: "$vcsRevision"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - project: "core-web"
              group: "sources"
            - project: "design-tokens"
              group: "css"
            - "/.dockerignore"
            - "/package.json"
            - "/pnpm-lock.yaml"
            - "/pnpm-workspace.yaml"
            - "/.docker/bake.hcl"
            - "/.docker/web/**/*"
            # Docker Hub shows these files on the page of the image, which holds none of them.
            - "!/.docker/web/README.md"
            - "!/.docker/web/short-description.txt"
        options:
            # The image lands in the Docker daemon rather than in files that moon can restore from its cache.
            cache: false
            # The paths in the bake file resolve from the root of the repository.
            runFromWorkspaceRoot: true

    lint-short-description:
        # The Push main workflow publishes the short description of the image to Docker Hub, which keeps at most 100
        # characters. The script resolves the file from its own location.
        command: "node scripts/lint-short-description.ts"
        inputs:
            - "scripts/lint-short-description.ts"
            - "/.docker/web/short-description.txt"

    typecheck:
        # The Angular builders check the sources of the app only, so the task checks the config files and the scripts
        # that tsconfig.node.json includes. moon tracks the files of each project for its own tasks only, so the inputs
        # also list the shared ESLint config that eslint.config.ts imports.
        command: "tsc --project tsconfig.node.json"
        inputs:
            - "@group(configs)"
            - "*.config.ts"
            - "scripts/**/*"
            - project: "config-eslint"
              group: "sources"
