$schema: "../../.moon/cache/schemas/project.json"

id: "web"
layer: "application"

fileGroups:
    sources:
        - "src/**/*"
        - "public/**/*"
        - "angular.json"
        - "tsconfig*.json"
        - "package.json"

tasks:
    start:
        command: "ng serve"
        preset: "server"
        deps:
            - "root:ssl-certs"
        inputs:
            - "@group(sources)"

    build:
        command: "ng build"
        inputs:
            - "@group(sources)"
        outputs:
            - "dist/**/*"

    image:
        command: "docker buildx bake --file .docker/bake.hcl web"
        deps:
            - "~:build"
        inputs:
            - "@group(sources)"
            - "/.dockerignore"
            - "/.docker/bake.hcl"
            - "/.docker/web/**/*"
        options:
            # The image lands in the Docker daemon rather than in files that moon can restore from its cache.
            cache: false
            # The paths in the bake file resolve from the root of the repository.
            runFromWorkspaceRoot: true
            # CI builds the image with docker/bake-action instead, when moon finds this task affected.
            runInCI: false

    test:
        command: "ng test"
        preset: "server"
        inputs:
            - "@group(sources)"
            - "vitest.config.ts"

    test-ci:
        command: "ng test -c ci"
        inputs:
            - "@group(sources)"
            - "vitest.config.ts"
        outputs:
            - "coverage/**/*"

    lint:
        command: "eslint . --max-warnings 0"
        inputs:
            - "@group(sources)"
            - "*.config.ts"
