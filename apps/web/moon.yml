$schema: "../../.moon/cache/schemas/project.json"

id: "web"
layer: "application"

fileGroups:
    sources:
        - "src/**/*"
        - "public/**/*"
        - "angular.json"
        - "tsconfig*.json"
        - "package.json"

tasks:
    start:
        command: "ng serve"
        preset: "server"
        deps:
            - "root:ssl-certs"
        inputs:
            - "@group(sources)"

    build:
        command: "ng build"
        inputs:
            - "@group(sources)"
        outputs:
            - "dist/**/*"

    test:
        command: "ng test"
        preset: "server"
        inputs:
            - "@group(sources)"
            - "vitest.config.ts"

    test-ci:
        command: "ng test -c ci"
        inputs:
            - "@group(sources)"
            - "vitest.config.ts"
        outputs:
            - "coverage/**/*"

    lint:
        command: "eslint . --max-warnings 0"
        inputs:
            - "@group(sources)"
            - "*.config.ts"
