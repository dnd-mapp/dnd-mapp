$schema: "../../../.moon/cache/schemas/project.json"

# moon names a project after its folder, which apps/web already takes, so the id follows the package name instead.
id: "core-web"
layer: "library"
tags:
    - "web"

project:
    title: "Web core"
    description: "The core of the web client: the root component, the app config, and the routes that the domain modules lazy-load from."
    owner: "@dnd-mapp/reviewers"
    maintainers:
        - "@NoNamer777"

fileGroups:
    sources:
        - "src/**/*"
        - "testing/**/*"
        - "angular.json"
        - "ng-package.json"

    tests:
        - "vitest.config.ts"

tasks:
    test:
        command: "ng test"
        preset: "server"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "@group(tests)"
            # The setup file of @dnd-mapp/ui-web moves the pointer away before each test.
            - project: "ui-web"
              group: "sources"

    test-ci:
        command: "ng test -c ci"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "@group(tests)"
            # The setup file of @dnd-mapp/ui-web moves the pointer away before each test.
            - project: "ui-web"
              group: "sources"
        outputs:
            - "coverage/**/*"

    typecheck:
        # The Angular builders check the sources and the tests of the package only, so the task checks the config files
        # that tsconfig.node.json includes. moon tracks the files of each project for its own tasks only, so the inputs
        # also list the shared ESLint config that eslint.config.ts imports.
        command: "tsc --project tsconfig.node.json"
        inputs:
            - "@group(configs)"
            - "*.config.ts"
            - project: "config-eslint"
              group: "sources"
