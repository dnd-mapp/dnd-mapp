$schema: "../../.moon/cache/schemas/project.json"

id: "design-tokens"
layer: "library"
# Every project may depend on a tooling project, so the tag lets the projects of any platform read the tokens.
tags:
    - "tooling"

project:
    title: "Design tokens"
    description: "The design tokens of the Penpot design system, and the CSS custom properties generated from them."
    owner: "@dnd-mapp/reviewers"
    maintainers:
        - "@NoNamer777"

fileGroups:
    sources:
        - "src/**/*"

    # The generated CSS and Sass partial that the apps load, so their tasks can list them as inputs.
    css:
        - "css/**/*"
        - "scss/**/*"

    tests:
        - "vitest.config.ts"

tasks:
    build:
        # Writes css/tokens.css from tokens.json, css/fonts.css from src/fonts.ts and the Fontsource packages, and
        # scss/breakpoints.scss from src/breakpoints.ts. The outputs are committed, so the app, Storybook, and the image
        # read them without running the task, as ADR 0006 records. Prettier formats fonts.css with the config of the
        # repository, so the inputs list it.
        command: "node src/main.ts"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "tokens.json"
            - "!src/**/*.spec.ts"
            - "/.editorconfig"
            - "/.prettierrc.json"
            - project: "common"
              group: "sources"
        outputs:
            - "css/fonts.css"
            - "css/tokens.css"
            - "scss/breakpoints.scss"

    check:
        # Fails when a committed file of build differs from what build generates, so a pull request can't change a
        # token, a font, a Fontsource package, or the breakpoint without the generated files, or those files by hand.
        command: "node src/main.ts --check"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "tokens.json"
            - "css/fonts.css"
            - "css/tokens.css"
            - "scss/breakpoints.scss"
            - "!src/**/*.spec.ts"
            - "/.editorconfig"
            - "/.prettierrc.json"
            - project: "common"
              group: "sources"

    test:
        command: "vitest"
        preset: "server"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "@group(tests)"

    test-ci:
        command: "vitest run --reporter dot --reporter github-actions"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "@group(tests)"
        outputs:
            - "coverage/**/*"

    typecheck:
        script: "tsc --project tsconfig.lib.json && tsc --project tsconfig.spec.json && tsc --project tsconfig.node.json"
        # tsconfig.node.json includes the configs of ESLint and Vitest, so the inputs list them next to the sources.
        # moon tracks the files of each project for its own tasks only, so the inputs also list the shared ESLint
        # config that eslint.config.ts imports.
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "*.config.ts"
            - project: "common"
              group: "sources"
            - project: "config-eslint"
              group: "sources"

    lint:
        # Extends the inherited task, since the type-aware rules read the types of the helpers.
        inputs:
            - project: "common"
              group: "sources"
