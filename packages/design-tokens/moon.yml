$schema: "../../.moon/cache/schemas/project.json"

id: "design-tokens"
layer: "library"
# Every project may depend on a tooling project, so the tag lets the projects of any platform read the tokens.
tags:
    - "tooling"

project:
    title: "Design tokens"
    description: "The design tokens of the Penpot design system, and the CSS custom properties generated from them."
    owner: "@dnd-mapp/reviewers"
    maintainers:
        - "@NoNamer777"

fileGroups:
    sources:
        - "src/**/*"

    tests:
        - "vitest.config.ts"

tasks:
    build:
        # Writes css/tokens.css from tokens.json. Both files are committed, so the app, Storybook, and the image read the
        # CSS without running the task, as ADR 0006 records.
        command: "node src/main.ts"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "tokens.json"
            - "!src/**/*.spec.ts"
        outputs:
            - "css/tokens.css"

    test:
        command: "vitest"
        preset: "server"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "@group(tests)"

    test-ci:
        command: "vitest run --reporter dot --reporter github-actions"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "@group(tests)"
        outputs:
            - "coverage/**/*"

    typecheck:
        script: "tsc --project tsconfig.lib.json && tsc --project tsconfig.spec.json && tsc --project tsconfig.node.json"
        # tsconfig.node.json includes the configs of ESLint and Vitest, so the inputs list them next to the sources.
        # moon tracks the files of each project for its own tasks only, so the inputs also list the shared ESLint
        # config that eslint.config.ts imports.
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "*.config.ts"
            - project: "config-eslint"
              group: "sources"
