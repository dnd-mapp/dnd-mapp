$schema: "../../../.moon/cache/schemas/project.json"

# moon names a project after its folder, which apps/web already takes, so the id follows the package name instead.
id: "ui-web"
layer: "library"
tags:
    - "web"

project:
    title: "Web UI"
    description: "The UI components of the web client, which every app and module of the web platform may import."
    owner: "@dnd-mapp/reviewers"
    maintainers:
        - "@NoNamer777"

fileGroups:
    sources:
        - "src/**/*"
        - "testing/**/*"
        - "angular.json"
        - "ng-package.json"

    tests:
        - "vitest.config.ts"

    storybook:
        - ".storybook/**/*"

tasks:
    storybook:
        command: "ng run ui-web:storybook"
        preset: "server"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "@group(storybook)"
            - project: "common"
              group: "sources"
            # angular.json loads the tokens into the preview, so a story shows the theme it picks.
            - project: "design-tokens"
              group: "css"

    build-storybook:
        command: "ng run ui-web:build-storybook"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "@group(storybook)"
            - project: "common"
              group: "sources"
            # angular.json loads the tokens into the preview, so a story shows the theme it picks.
            - project: "design-tokens"
              group: "css"
        outputs:
            - "dist/storybook/**/*"

    test:
        command: "ng test"
        preset: "server"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "@group(tests)"
            # The setup file of @dnd-mapp/testing moves the pointer away before each test.
            - project: "testing"
              group: "sources"
            - project: "common"
              group: "sources"
            # The styles of the components import the breakpoint from the Sass partial.
            - project: "design-tokens"
              group: "css"
            # boot-script.spec.ts reads the boot script of the web app to check it against ThemeService.
            - "/apps/web/src/index.html"

    test-ci:
        command: "ng test -c ci"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "@group(tests)"
            # The setup file of @dnd-mapp/testing moves the pointer away before each test.
            - project: "testing"
              group: "sources"
            - project: "common"
              group: "sources"
            # The styles of the components import the breakpoint from the Sass partial.
            - project: "design-tokens"
              group: "css"
            # boot-script.spec.ts reads the boot script of the web app to check it against ThemeService.
            - "/apps/web/src/index.html"
        outputs:
            - "coverage/**/*"

    typecheck:
        # The Angular builders check the sources and the tests of the package only, and Storybook compiles the stories
        # without checking them, so the task checks the config files that tsconfig.node.json includes, and the stories
        # and their templates that tsconfig.storybook.json includes. moon tracks the files of each project for its own
        # tasks only, so the inputs also list the helpers of @dnd-mapp/common and the shared ESLint config that
        # eslint.config.ts imports.
        script: "tsc --project tsconfig.node.json && ngc --project tsconfig.storybook.json --noEmit"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "@group(storybook)"
            - "*.config.ts"
            - project: "common"
              group: "sources"
            - project: "config-eslint"
              group: "sources"

    lint:
        # Extends the inherited task, since the type-aware rules read the types of the helpers.
        inputs:
            - project: "common"
              group: "sources"
