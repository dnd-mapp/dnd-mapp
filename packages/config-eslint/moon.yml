$schema: "../../.moon/cache/schemas/project.json"

id: "config-eslint"
layer: "configuration"
tags:
    - "tooling"

project:
    title: "ESLint config"
    description: "The shared ESLint presets of the projects, which also enforce the dependency rules between them."
    owner: "@dnd-mapp/reviewers"
    maintainers:
        - "@NoNamer777"

fileGroups:
    sources:
        - "src/**/*"

tasks:
    typecheck:
        command: "tsc"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
