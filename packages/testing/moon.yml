$schema: "../../.moon/cache/schemas/project.json"

id: "testing"
layer: "library"
# Every project may depend on a tooling project, so the tag lets the tests of any platform import the helpers.
tags:
    - "tooling"

project:
    title: "Test helpers"
    description: "Helpers for the tests of any project, such as an in-memory mock of node:fs for Vitest."
    owner: "@dnd-mapp/reviewers"
    maintainers:
        - "@NoNamer777"

fileGroups:
    sources:
        - "src/**/*"

    tests:
        - "vitest.config.ts"

tasks:
    test:
        command: "vitest"
        preset: "server"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "@group(tests)"

    test-ci:
        command: "vitest run --reporter dot --reporter github-actions"
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "@group(tests)"
        outputs:
            - "coverage/**/*"

    typecheck:
        command: "tsc"
        # tsconfig.json includes the configs of ESLint and Vitest next to the sources.
        inputs:
            - "@group(sources)"
            - "@group(configs)"
            - "*.config.ts"
